<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft - AI Comic Story Creator</title>
</head>

<body>
    <h1>🎨 ComicCraft</h1>
    <h2>AI Comic Story Creator</h2>

    <p>Enter your story idea:</p>

    <textarea id="story" rows="8" cols="50"
        placeholder="Type your story idea here..."></textarea>

    <br><br>

    <button>Generate Comic</button>

    <h2>Generated Comic</h2>

    <div id="output">
        Your AI-generated comic will appear here.
    </div>
</body>
</html>
